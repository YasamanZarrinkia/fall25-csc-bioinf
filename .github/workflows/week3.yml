name: Week 3 CI

on:
  push:
  pull_request:

jobs:
  test-week3:
    runs-on: ubuntu-latest

    steps:
      - name: 🔎 Checkout repo
        uses: actions/checkout@v4

      - name: 🐍 Set up Python (3.11)
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'   # ← no cache here

      - name: 📦 Install Python deps (Biotite test side)
        run: |
          python -m pip install --upgrade pip
          pip install numpy biotite find_libpython

      - name: 🧬 Install Codon + seq plugin
        run: |
          mkdir -p "${HOME}/.codon"
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "${HOME}/.codon"
          curl -L https://github.com/exaloop/seq/releases/download/v0.11.5/seq-linux-x86_64.tar.gz \
            | tar zxvf - -C "${HOME}/.codon/lib/codon/plugins"
          echo "${HOME}/.codon/bin" >> "$GITHUB_PATH"

      - name: 🔗 Configure Codon Python bridge (optional)
        run: |
          python - <<'PY'
          import find_libpython, os
          lib = find_libpython.find_libpython()
          print("Using libpython:", lib)
          with open(os.environ["GITHUB_ENV"], "a") as f:
              f.write(f"CODON_PYTHON={lib}\n")
          PY

      - name: ▶️ Make week3/evaluate.sh executable
        run: chmod +x week3/evaluate.sh

      - name: 🧪 Run Week 3 tests
        working-directory: week3
        run: |
          set -e
          ./evaluate.sh | tee /tmp/eval.out
          echo "## Week 3 Results" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          cat /tmp/eval.out >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
