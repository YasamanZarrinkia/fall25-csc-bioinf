name: Week 5 – CYP Gene Pipeline CI

on:
  push:
    paths:
      - 'week5/**'
      - '.github/workflows/week5.yml'
  workflow_dispatch:

jobs:
  week5:
    runs-on: ubuntu-22.04

    steps:
      # 🧩 Step 1 – Check out repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 🐍 Step 2 – Set up Python environment
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # 🧬 Step 3 – Install system dependencies for bioinformatics tools
      - name: Install system dependencies and bioinformatics tools
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            samtools bcftools minimap2 tabix wget unzip xvfb \
            build-essential git zlib1g-dev openjdk-11-jre-headless
          python3 -m pip install --upgrade pip

      # 🧪 Step 4 – Build and install HapCUT2 from source
      - name: Build and install HapCUT2
        run: |
          git clone https://github.com/vibansal/hapcut2.git /tmp/hapcut2
          cd /tmp/hapcut2
          make
          sudo cp build/HAPCUT2 /usr/local/bin/hapcut2
          hapcut2 --version || echo "✅ HapCUT2 installed successfully"

      # 🧰 Step 5 – Install Python packages for pipeline and IGV automation
      - name: Install Python dependencies
        run: |
          pip install \
            biopython pandas matplotlib seaborn \
            tqdm pysam ipywidgets openpyxl \
            find_libpython

      # ⚙️ Step 6 – Run the Week 5 pipeline notebook end-to-end
      - name: Run Week 5 pipeline (notebook)
        run: |
          echo "🚀 Running Week 5 bioinformatics pipeline"
          jupyter nbconvert --to notebook --execute week5/week5_pipeline.ipynb \
            --output week5/out/week5_executed.ipynb

      # 📸 Step 7 – Upload results and reports as artifacts
      - name: Upload Week 5 artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week5-results
          path: |
            week5/out/
            week5/igv_snaps/
            week5/week5_pipeline.ipynb

