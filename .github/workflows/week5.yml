name: 🧬 Week5 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"
  workflow_dispatch:

jobs:
  run-week5-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      # --- CHECKOUT REPO ---
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      # --- PYTHON SETUP ---
      - name: 🐍 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # --- SYSTEM DEPS ---
      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            samtools bcftools minimap2 tabix \
            wget unzip xvfb build-essential git \
            zlib1g-dev libhts-dev libbz2-dev tree

      # --- HAPCUT2 INSTALLATION ---
      - name: 🧬 Build and install HapCUT2 from source
        run: |
          git clone https://github.com/vibansal/hapcut2.git /tmp/hapcut2
          cd /tmp/hapcut2
          make
          sudo cp build/HAPCUT2 /usr/local/bin/hapcut2 || true
          sudo cp build/extractHAIRS /usr/local/bin/extractHAIRS || true
          sudo chmod +x /usr/local/bin/hapcut2 /usr/local/bin/extractHAIRS
          hapcut2 --version || echo "✅ HapCUT2 installed successfully"

      # --- PYTHON DEPS ---
      - name: 📦 Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install jupyter nbconvert matplotlib pandas numpy

      # --- RUN NOTEBOOK ---
      - name: 🚀 Execute Week5 notebook
        run: |
          mkdir -p week5
          jupyter nbconvert --to notebook --execute week5/week5-pipeline.ipynb \
            --output week5-output.ipynb \
            --output-dir week5 \
            --ExecutePreprocessor.timeout=3600
        env:
          DISPLAY: ":99"

      # --- DEBUG FILE LISTING ---
      - name: 🧾 List generated files
        run: |
          echo "== WEEK5 DIRECTORY STRUCTURE =="
          ls -R week5 || true

      # --- UPLOAD EXECUTED NOTEBOOK ---
      - name: 📤 Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: week5-pipeline-output
          path: week5/week5-output.ipynb

      # --- UPLOAD RESULTS (JSON, VCF, BAM, PNG) ---
      - name: 📦 Upload analysis results
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: week5-results
          path: |
            week5/**/*.vcf.gz
            week5/**/*.bam
            week5/**/*.txt
            week5/**/*.json
            week5/**/*.png

