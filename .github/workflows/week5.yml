name: Week5
on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"
  workflow_dispatch:

jobs:
  run-week5:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Mambaforge (conda) for bio tools
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-variant: Mambaforge
          channels: conda-forge,bioconda,defaults
          channel-priority: true
          activate-environment: week5
          auto-activate-base: false
          python-version: "3.10"

      - name: Install CLI tools (bioconda)
        shell: bash -l {0}
        run: |
          mamba install -y minimap2 samtools bcftools freebayes hapcut2 seqtk wgsim tabix
          # Optional: cyvcf2 for Python VCF parsing
          mamba install -y python=3.10 pip cyvcf2

      - name: Install Jupyter + nbconvert
        shell: bash -l {0}
        run: |
          mamba install -y notebook nbconvert ipykernel
          python -m ipykernel install --user --name week5 --display-name "Python (week5)"

      - name: Download IGV (headless) + Java + Xvfb
        shell: bash -l {0}
        run: |
          sudo apt-get update
          sudo apt-get install -y openjdk-11-jre xvfb unzip curl
          mkdir -p $GITHUB_WORKSPACE/tools
          cd $GITHUB_WORKSPACE/tools
          # IGV download (Broad Institute). If this version ever changes, update the URL.
          curl -L -o igv.zip https://data.broadinstitute.org/igv/projects/downloads/2.15/IGV_Linux_2.15.4_WithJava.zip
          unzip -q igv.zip
          echo "$GITHUB_WORKSPACE/tools/IGV_Linux_2.15.4/igv.sh" > $GITHUB_WORKSPACE/tools/igv_path.txt

      - name: Execute notebook
        shell: bash -l {0}
        env:
          IGV_SH: ${{ github.workspace }}/tools/IGV_Linux_2.15.4/igv.sh
        run: |
          jupyter nbconvert --to notebook --execute week5/week5.ipynb --ExecutePreprocessor.timeout=0 --output week5_executed.ipynb

      - name: Upload artifacts (optional but helpful)
        uses: actions/upload-artifact@v4
        with:
          name: week5-results
          path: |
            week5_executed.ipynb
            week5/out/**
            week5/igv_snaps/**

