name: Week5 CI
on:
  push:
    paths:
      - "week5/**"
      - ".github/workflows/week5.yml"
  pull_request:
  workflow_dispatch:

jobs:
  run-week5:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Miniconda + bioconda/conda-forge
      - name: Set up Conda (no mamba)
        uses: conda-incubator/setup-miniconda@v3
        with:
          activate-environment: bio
          python-version: "3.10"
          auto-update-conda: false
          channels: conda-forge,bioconda,defaults
          channel-priority: true
          use-mamba: false

      - name: System packages for IGV/headless
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb openjdk-11-jre curl wget unzip coreutils

      - name: Install bio tools (conda)
        shell: bash -l {0}
        run: |
          conda install -y \
            -c conda-forge -c bioconda \
            samtools bcftools minimap2 hapcut2 whatshap seqtk \
            jupyter nbconvert ipykernel

      - name: Download IGV jar
        run: |
          mkdir -p tools
          wget -O tools/IGV_2.4.9.zip "https://data.broadinstitute.org/igv/projects/downloads/2.4/IGV_2.4.9.zip"
          unzip -j tools/IGV_2.4.9.zip "IGV_2.4.9/igv.jar" -d tools
          ls -lh tools || true

      - name: Show versions
        shell: bash -l {0}
        run: |
          which python && python --version
          samtools --version | head -1 || true
          bcftools --version | head -1 || true
          minimap2 --version || true
          hapcut2 --version || true
          whatshap --version | head -1 || true
          seqtk 2>&1 | head -1 || true
          java -version || true
          xvfb-run -help 2>&1 | head -1 || true
          jupyter --version

      - name: Execute notebook
        shell: bash -l {0}
        run: |
          jupyter nbconvert --to notebook --execute \
            --ExecutePreprocessor.timeout=900 \
            --output executed_week5.ipynb \
            week5/week5.ipynb

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: executed-week5
          path: executed_week5.ipynb
