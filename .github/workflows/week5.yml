name: Week5 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - 'week5/**'
      - '.github/workflows/week5.yml'
  workflow_dispatch:

jobs:
  week5:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            build-essential git wget unzip xvfb \
            samtools bcftools minimap2 tabix \
            libhts-dev zlib1g-dev libcurl4-gnutls-dev \
            libbz2-dev liblzma-dev

      - name: 🧬 Build HapCUT2 from source
        run: |
          git clone https://github.com/vibansal/hapcut2.git /tmp/hapcut2
          cd /tmp/hapcut2
          make
          sudo cp build/HAPCUT2 /usr/local/bin/hapcut2
          sudo cp build/extractHAIRS /usr/local/bin/extractHAIRS
          hapcut2 --version || echo "✅ HapCUT2 installed"

      - name: 🧪 Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 📦 Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib numpy pandas pysam biopython

      - name: 🚀 Run Week5 pipeline notebook
        run: |
          pip install nbconvert jupyter
          jupyter nbconvert --to notebook --execute week5/week5-pipeline.ipynb \
            --output week5/week5-output.ipynb \
            --ExecutePreprocessor.timeout=3600

      - name: 📤 Upload artifacts (results + logs)
        uses: actions/upload-artifact@v4
        with:
          name: week5-results
          path: |
            week5/**/*.vcf.gz
            week5/**/*.bam
            week5/**/*.txt
            week5/**/*.json
            week5/**/*.png
            week5/week5-output.ipynb

