name: Github CI

on:
  push:
    paths:
      - 'week5/**'
      - '.github/workflows/actions.yml'
  workflow_dispatch:

jobs:
  week5-pipeline:
    runs-on: ubuntu-latest

    steps:
      # --- Info about trigger ---
      - name: 🎉 Trigger Info
        run: |
          echo "Triggered by ${{ github.event_name }} on branch ${{ github.ref }}"
          echo "Repository: ${{ github.repository }}"

      # --- Checkout code ---
      - name: 🧩 Check out repository
        uses: actions/checkout@v5

      # --- Setup Python ---
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # --- Install system & bioinformatics dependencies ---
      - name: 🧬 Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            samtools bcftools minimap2 tabix \
            hapcut2 wget unzip xvfb
          python3 -m pip install --upgrade pip

      # --- Install Python dependencies ---
      - name: 📦 Install Python packages
        run: |
          pip install jupyter nbconvert ipykernel matplotlib seaborn pandas numpy find_libpython

      # --- Optional: Install Codon to keep template consistent ---
      - name: 🧠 Install Codon (optional)
        run: |
          mkdir -p ${HOME}/.codon
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C ${HOME}/.codon
          echo "${HOME}/.codon/bin" >> $GITHUB_PATH
          echo "Codon installed at ${HOME}/.codon/bin"

      # --- Execute Jupyter notebook ---
      - name: 🚀 Execute Week5 notebook
        env:
          CI: "true"
        run: |
          echo "Running week5/week5.ipynb ..."
          jupyter nbconvert --to notebook \
            --execute week5/week5.ipynb \
            --output week5_executed.ipynb --ExecutePreprocessor.timeout=3600

      # --- Upload executed notebook as artifact ---
      - name: 📤 Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: week5_executed_notebook
          path: week5/week5_executed.ipynb

      # --- Final summary ---
      - name: ✅ Summary
        run: echo "Week5 Bioinformatics pipeline executed successfully with HapCUT2!"

