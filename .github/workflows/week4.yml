name: Week4
on:
  push:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  workflow_dispatch:

jobs:
  run-week4:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenMP (Codon needs it)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install Codon (Linux x86_64) & add to PATH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codon"
          curl -fsSL https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "$HOME/.codon"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

      - name: Set Codon Python bridge
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install find_libpython
          echo "CODON_PYTHON=$(python -c 'import find_libpython,sys; sys.stdout.write(find_libpython.find_libpython())')" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          which codon && codon --version
          python --version
          echo "CODON_PYTHON=$CODON_PYTHON"

      - name: Show evaluate.sh (first 200 lines)
        run: sed -n '1,200p' week4/evaluate.sh

      - name: Make evaluate executable
        run: chmod +x week4/evaluate.sh

      - name: List week4 contents
        run: ls -la week4

      - name: Run Week4 evaluate (stdout only)
        working-directory: week4
        run: bash -xe ./evaluate.sh
