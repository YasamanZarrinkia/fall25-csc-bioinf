name: Week4
on:
  push:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  workflow_dispatch:

jobs:
  run-week4:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install OpenMP (needed by Codon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install Codon compiler (official script) and add to PATH
        run: |
          curl -fsSL https://exaloop.io/install.sh | bash -s -- -y
          echo "$HOME/.codon/bin" >> $GITHUB_PATH

      - name: Verify Codon is on PATH
        run: codon --version

      - name: Normalize line endings & make executable
        run: |
          sed -i 's/\r$//' week4/evaluate.sh || true
          chmod +x week4/evaluate.sh

      - name: Run evaluate.sh (print everything)
        working-directory: week4
        run: bash -xe ./evaluate.sh
