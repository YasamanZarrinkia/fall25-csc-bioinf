name: Week 4 CI
on:
  push:
  pull_request:

jobs:
  week4:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Codon (Linux x86_64)
        run: |
          mkdir -p "${HOME}/.codon"
          curl -fsSL https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "${HOME}/.codon"
          echo "${HOME}/.codon/bin" >> $GITHUB_PATH

      - name: Set Codon Python bridge
        run: |
          python -m pip install --upgrade pip
          pip install find_libpython
          echo "CODON_PYTHON=$(python - <<'PY'
import find_libpython; print(find_libpython.find_libpython())
PY
)" >> $GITHUB_ENV

      # Build the Codon binary (hard-require compiled binary)
      - name: Build Codon binary
        run: |
          mkdir -p week4/bin
          codon build -release -o week4/bin/align_codon week4/codon_impl/align_codon.py

      - name: Make evaluate executable
        run: chmod +x week4/evaluate.sh

      - name: Run Week 4 evaluate
        run: bash week4/evaluate.sh
