name: Week4
on:
  push:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  workflow_dispatch:

jobs:
  run-week4:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenMP (needed by Codon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install Codon (Linux x86_64)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codon"
          curl -fsSL https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "$HOME/.codon"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

      - name: Set Codon Python bridge
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install find_libpython
          echo "CODON_PYTHON=$(python -c 'import find_libpython,sys; sys.stdout.write(find_libpython.find_libpython())')" >> "$GITHUB_ENV"

      - name: Build Codon binary (required by evaluate.sh)
        run: |
          set -euo pipefail
          mkdir -p week4/bin
          codon --version
          codon build -release -o week4/bin/align_codon week4/codon_impl/align_codon.py

      - name: Make evaluate.sh executable
        run: chmod +x week4/evaluate.sh

      - name: Run Week4 evaluate (stdout only)
        run: bash -xe week4/evaluate.sh
