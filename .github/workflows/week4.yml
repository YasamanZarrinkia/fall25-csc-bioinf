name: Week4
on:
  push:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  workflow_dispatch:

jobs:
  run-week4:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install deps for Codon (optional but likely needed)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev
          python -m pip install --upgrade pip
          pip install codon
      - name: Normalize line endings & make executable
        run: |
          sed -i 's/\r$//' week4/evaluate.sh || true
          chmod +x week4/evaluate.sh
      - name: Run evaluate.sh (print everything)
        working-directory: week4
        run: |
          bash -xe ./evaluate.sh
