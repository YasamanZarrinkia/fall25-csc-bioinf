name: Week 4 CI
on:
  push:
    paths: ['week4/**', '.github/workflows/week4.yml']
  pull_request:
    paths: ['week4/**', '.github/workflows/week4.yml']
  workflow_dispatch:

jobs:
  week4:
    runs-on: ubuntu-22.04
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install OpenMP (needed by Codon)
        run: |
          sudo apt-get update
          sudo apt-get install -y libomp-dev

      - name: Install Codon (Linux x86_64)
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codon"
          curl -fsSL https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "$HOME/.codon"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

      - name: Set Codon Python bridge
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install find_libpython
          echo "CODON_PYTHON=$(python -c 'import find_libpython,sys; sys.stdout.write(find_libpython.find_libpython())')" >> "$GITHUB_ENV"

      - name: Verify tools
        run: |
          which codon && codon --version
          python --version
          echo "CODON_PYTHON=$CODON_PYTHON"

      - name: Make evaluate executable
        run: chmod +x week4/evaluate.sh

      # RUN ONCE: print to stdout AND save a copy with tee (no outputs/ folder)
      - name: Run Week 4 evaluate (stdout + save)
        working-directory: week4
        run: |
          set -euo pipefail
          ./evaluate.sh 2>&1 | tee ../week4_timing.txt

      - name: Upload timing output (artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week4-timing
          path: week4_timing.txt
          if-no-files-found: error
