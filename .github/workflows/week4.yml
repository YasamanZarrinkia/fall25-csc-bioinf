name: Week4
on:
  push:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  pull_request:
    paths:
      - 'week4/**'
      - '.github/workflows/week4.yml'
  workflow_dispatch:

jobs:
  run-week4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make evaluate.sh executable
        working-directory: week4
        run: |
          sed -i 's/\r$//' evaluate.sh || true
          chmod +x evaluate.sh
      - name: Run
        working-directory: week4
        run: ./evaluate.sh 2>&1 | tee outputs/week4_run.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: week4-artifacts
          path: week4/outputs/**
