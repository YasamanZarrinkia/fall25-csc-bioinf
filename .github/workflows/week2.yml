name: Week 2 – Codon & Python

on:
  push:
    paths:
      - "week2/**"
      - ".github/workflows/week2.yml"
  pull_request:
    paths:
      - "week2/**"
      - ".github/workflows/week2.yml"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Python dependencies (trviz for Python test)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "trviz>=1.2.0"
          python - <<'PY'
import trviz, sys
print("✅ Python:", sys.version)
print("✅ trviz:", getattr(trviz, "__version__", "unknown"))
PY

      - name: Install Codon
        run: |
          mkdir -p "$HOME/.codon"
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz \
            | tar zxvf - --strip-components=1 -C "$HOME/.codon"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"
          codon --version

      - name: Make evaluator executable
        run: chmod +x ./week2/evaluate.sh

      - name: Run evaluator
        env:
          PYTHONPATH: week2/code
        run: ./week2/evaluate.sh
