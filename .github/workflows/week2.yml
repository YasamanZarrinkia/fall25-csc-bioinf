name: week2-ci

on:
  push:
    paths:
      - 'week2/**'
      - '.github/workflows/week2.yml'
  pull_request:
    paths:
      - 'week2/**'
      - '.github/workflows/week2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (trviz for Python test)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "trviz>=1.2.0"
          python - <<'EOF'
          import sys, trviz
          print("✅ Python:", sys.version)
          print("✅ trviz:", getattr(trviz, "__version__", "unknown"))
          EOF

      - name: Install Codon (robust)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codon"
          TMP=/tmp/codon.tar.gz

          try_fetch () {
            local url="$1"
            echo "Fetching: $url"
            if curl -fL --retry 3 --retry-delay 2 -o "$TMP" "$url"; then
              if file "$TMP" | grep -qi 'gzip compressed data'; then
                echo "Got a valid gzip archive."
                return 0
              else
                echo "Downloaded file is not gzip; maybe a 404 HTML page."
                return 1
              fi
            else
              echo "curl failed for $url"
              return 1
            fi
          }

          # Try both common asset names for v0.19.3
          if ! try_fetch "https://github.com/exaloop/codon/releases/download/v0.19.3/codon-deploy-linux-x86_64.tar.gz"; then
            echo "Retrying with alternate asset name..."
            try_fetch "https://github.com/exaloop/codon/releases/download/v0.19.3/codon-linux-x86_64.tar.gz"
          fi

          # Extract
          tar -xzf "$TMP" -C "$HOME/.codon" --strip-components=1
          ls -la "$HOME/.codon/bin" || true

          # Make available now and later
          export PATH="$HOME/.codon/bin:$PATH"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"

          which codon
          codon --version

      - name: Make evaluator executable
        run: chmod +x week2/evaluate.sh

      - name: Run evaluator
        env:
          PYTHONPATH: week2/code
        run: week2/evaluate.sh
