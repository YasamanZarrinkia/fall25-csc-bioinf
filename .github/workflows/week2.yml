name: week2-ci

on:
  push:
    paths:
      - 'week2/**'
      - '.github/workflows/week2.yml'
  pull_request:
    paths:
      - 'week2/**'
      - '.github/workflows/week2.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Python deps (trviz for Python test)
        run: |
          python -m pip install --upgrade pip wheel setuptools
          python -m pip install "trviz>=1.2.0"
          python - <<'EOF'
          import sys, trviz
          print("✅ Python:", sys.version)
          print("✅ trviz:", getattr(trviz, "__version__", "unknown"))
          EOF

      - name: Install Codon
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.codon"
          # Download the deploy archive that matches your logs
          curl -L https://github.com/exaloop/codon/releases/download/v0.19.3/codon-deploy-linux-x86_64.tar.gz -o /tmp/codon.tar.gz
          tar -xzf /tmp/codon.tar.gz -C "$HOME/.codon" --strip-components=1
          ls -la "$HOME/.codon/bin" || true
          # Make codon available now and in later steps
          export PATH="$HOME/.codon/bin:$PATH"
          echo "$HOME/.codon/bin" >> "$GITHUB_PATH"
          which codon
          codon --version

      - name: Make evaluator executable
        run: chmod +x week2/evaluate.sh

      - name: Run evaluator
        env:
          PYTHONPATH: week2/code
        run: week2/evaluate.sh
