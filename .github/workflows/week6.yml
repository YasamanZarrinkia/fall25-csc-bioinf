name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            wget tar gzip unzip \
            python3 python3-pip python3-venv \
            build-essential \
            libz-dev libbz2-dev liblzma-dev

      - name: 🐍 Set up Python environment
        run: |
          python3 -m venv week6-env
          source week6-env/bin/activate
          python3 -m pip install --upgrade pip
          pip install scanpy anndata pandas numpy scipy matplotlib seaborn jupyter
          pip install pyroe
          pip install "alevin-fry>=0.10.0" --extra-index-url https://test.pypi.org/simple/ || true

      - name: 🧬 Install Salmon binary (v1.10.0)
        run: |
          wget https://github.com/COMBINE-lab/salmon/releases/download/v1.10.0/salmon-1.10.0_linux_x86_64.tar.gz
          tar -xzf salmon-1.10.0_linux_x86_64.tar.gz
          sudo cp salmon-1.10.0_linux_x86_64/bin/salmon /usr/local/bin/
          sudo chmod +x /usr/local/bin/salmon

      - name: 🧪 Run week6 notebook non-interactively
        run: |
          source week6-env/bin/activate
          pip install nbconvert jupyter
          jupyter nbconvert --to notebook --execute week6/week6.ipynb --output week6_executed.ipynb

