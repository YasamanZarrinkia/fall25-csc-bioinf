name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            wget tar gzip unzip \
            build-essential

      - name: 🐍 Set up Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.9"
          channels: conda-forge,bioconda

      - name: 🧬 Install bioinformatics packages
        run: |
          conda install -y -c bioconda -c conda-forge \
            salmon alevin-fry \
            scanpy anndata pandas numpy scipy matplotlib seaborn jupyter \
            pyroe celltypist \
            nbconvert

      - name: 📦 Download data (placeholder)
        run: |
          mkdir -p week6/data
          echo "Data download would happen here"

      - name: 🧪 Run week6 notebook
        run: |
          conda init bash
          source ~/.bashrc
          jupyter nbconvert --to notebook --execute week6/week6.ipynb --output week6_executed.ipynb
