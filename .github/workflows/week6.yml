name: Week 6 Single-Cell Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    
    steps:
      - name: 📥 Check out repository
        uses: actions/checkout@v4
        with:
          lfs: true
      
      - name: 🗄️ Cache Salmon index
        id: cache-salmon-index
        uses: actions/cache@v3
        with:
          path: data/salmon_index
          key: salmon-index-v1-${{ hashFiles('data/splici_ref/splici_fl86.fa') }}
          restore-keys: |
            salmon-index-v1-
      
      - name: 🗄️ Cache splici reference
        id: cache-splici
        uses: actions/cache@v3
        with:
          path: data/splici_ref
          key: splici-ref-v1-${{ hashFiles('data/toy_human_ref/**/*.fa', 'data/toy_human_ref/**/*.gtf') }}
          restore-keys: |
            splici-ref-v1-
      
      - name: 🗄️ Cache alevin output
        id: cache-alevin
        uses: actions/cache@v3
        with:
          path: data/alevin_output
          key: alevin-output-v1-${{ hashFiles('data/toy_read_fastq/*.fastq') }}
          restore-keys: |
            alevin-output-v1-
      
      - name: 🗄️ Cache conda packages
        uses: actions/cache@v3
        with:
          path: ~/conda_pkgs_dir
          key: conda-packages-${{ runner.os }}-${{ hashFiles('**/week6.yml') }}
          restore-keys: |
            conda-packages-${{ runner.os }}-
      
      - name: 🐍 Install Miniforge
        run: |
          echo "============================================"
          echo "Installing Miniforge (mamba + conda)"
          echo "============================================"
          
          # Download Miniforge installer
          wget -q https://github.com/conda-forge/miniforge/releases/latest/download/Miniforge3-Linux-x86_64.sh -O miniforge.sh
          
          # Install Miniforge
          bash miniforge.sh -b -p $HOME/miniforge
          
          # Initialize conda
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          source "$HOME/miniforge/etc/profile.d/mamba.sh"
          
          # Update conda config
          conda config --set always_yes yes --set changeps1 no
          conda config --add channels conda-forge
          conda config --add channels bioconda
          conda config --set channel_priority strict
          
          # Update base environment
          mamba update -n base -c conda-forge conda mamba
          
          echo "✓ Miniforge installed"
          echo "Conda version: $(conda --version)"
          echo "Mamba version: $(mamba --version)"
      
      - name: 🧬 Create conda environment
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          source "$HOME/miniforge/etc/profile.d/mamba.sh"
          
          echo "============================================"
          echo "Creating week6-env environment"
          echo "============================================"
          
          # Create environment with all packages
          mamba create -n week6-env -y \
            python=3.11 \
            salmon=1.10.0 \
            alevin-fry \
            samtools \
            scanpy \
            anndata \
            pyroe \
            leidenalg \
            python-igraph \
            celltypist \
            pandas \
            numpy \
            scipy \
            matplotlib \
            seaborn \
            jupyter \
            nbconvert \
            nbformat
          
          echo "✓ Environment created"
      
      - name: 💾 Check system resources
        run: |
          echo "============================================"
          echo "System Resources"
          echo "============================================"
          echo "CPU cores: $(nproc)"
          echo ""
          echo "Memory:"
          free -h
          echo ""
          echo "Disk space:"
          df -h .
          echo "============================================"
      
      - name: ✅ Version checks
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate week6-env
          
          echo "============================================"
          echo "Software Versions"
          echo "============================================"
          echo "Python: $(python --version)"
          echo "Conda: $(conda --version)"
          echo "Mamba: $(mamba --version)"
          echo ""
          echo "Bioinformatics tools:"
          echo "  Salmon: $(salmon --version 2>&1 | head -1)"
          echo "  Alevin-fry: $(alevin-fry --version)"
          echo "  Samtools: $(samtools --version | head -1)"
          echo ""
          echo "Python packages:"
          python -c "import scanpy; print(f'  Scanpy: {scanpy.__version__}')"
          python -c "import anndata; print(f'  AnnData: {anndata.__version__}')"
          python -c "import pyroe; print('  PyROE: installed')"
          python -c "import celltypist; print('  CellTypist: installed')"
          python -c "import leidenalg; print('  Leidenalg: installed')"
          echo "============================================"
      
      - name: 📂 Check data files
        run: |
          echo "============================================"
          echo "Checking for required data files"
          echo "============================================"
          
          REQUIRED_FILES=(
            "data/toy_read_fastq/selected_R1_reads.fastq"
            "data/toy_read_fastq/selected_R2_reads.fastq"
            "data/toy_human_ref/fasta/genome.fa"
            "data/toy_human_ref/fasta/genome.fa.fai"
            "data/toy_human_ref/genes/genes.gtf"
          )
          
          MISSING=0
          for file in "${REQUIRED_FILES[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(ls -lh "$file" | awk '{print $5}')
              echo "✓ $file ($SIZE)"
            else
              echo "✗ $file (MISSING)"
              MISSING=$((MISSING + 1))
            fi
          done
          
          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "⚠ Warning: $MISSING required file(s) missing."
          else
            echo "✓ All required data files present"
          fi
          echo "============================================"
      
      - name: 🗂️ Check cached artifacts
        run: |
          echo "============================================"
          echo "Cache Status"
          echo "============================================"
          
          if [ -d "data/splici_ref" ] && [ -f "data/splici_ref/splici_fl86.fa" ]; then
            echo "✓ Splici reference cached"
            ls -lh data/splici_ref/splici_fl86.fa
          else
            echo "○ Splici reference not cached (will be built)"
          fi
          
          if [ -d "data/salmon_index" ] && [ -f "data/salmon_index/versionInfo.json" ]; then
            echo "✓ Salmon index cached"
          else
            echo "○ Salmon index not cached (will be built)"
          fi
          
          if [ -d "data/alevin_output" ]; then
            echo "✓ Alevin output cached"
          else
            echo "○ Alevin output not cached (will be generated)"
          fi
          echo "============================================"
      
      - name: 📓 Run Week 6 notebook
        run: |
          source "$HOME/miniforge/etc/profile.d/conda.sh"
          conda activate week6-env
          
          cd week6
          
          echo "============================================"
          echo "Executing Jupyter Notebook"
          echo "============================================"
          echo "Start time: $(date)"
          echo ""
          
          # Set memory limit if possible (6GB)
          ulimit -v 6000000 2>/dev/null || echo "Could not set memory limit"
          
          # Execute notebook with extended timeout
          jupyter nbconvert \
            --to notebook \
            --execute week6.ipynb \
            --output week6_executed.ipynb \
            --ExecutePreprocessor.timeout=3600 \
            --ExecutePreprocessor.kernel_name=python3
          
          EXIT_CODE=$?
          echo ""
          echo "End time: $(date)"
          echo "Exit code: $EXIT_CODE"
          echo "============================================"
          
          exit $EXIT_CODE
      
      - name: ✅ Validate outputs
        if: success()
        run: |
          echo "============================================"
          echo "Validating Generated Outputs"
          echo "============================================"
          
          EXPECTED_OUTPUTS=(
            "data/annotated_adata.h5ad"
            "data/cell_annotations.csv"
            "data/clustering_results.png"
            "data/annotated_clusters.png"
            "data/qc_metrics.png"
            "data/marker_genes.png"
          )
          
          MISSING=0
          TOTAL_SIZE=0
          
          for file in "${EXPECTED_OUTPUTS[@]}"; do
            if [ -f "$file" ]; then
              SIZE=$(stat -c%s "$file" 2>/dev/null || echo "0")
              SIZE_HR=$(ls -lh "$file" | awk '{print $5}')
              echo "✓ $file ($SIZE_HR)"
              TOTAL_SIZE=$((TOTAL_SIZE + SIZE))
            else
              echo "✗ $file (MISSING)"
              MISSING=$((MISSING + 1))
            fi
          done
          
          echo ""
          if [ $MISSING -gt 0 ]; then
            echo "❌ Error: $MISSING expected output(s) not generated!"
            exit 1
          else
            echo "✓ All expected outputs generated successfully"
            echo "Total output size: $(numfmt --to=iec $TOTAL_SIZE 2>/dev/null || echo $TOTAL_SIZE bytes)"
          fi
          echo "============================================"
      
      - name: 📋 Check notebook execution
        if: always()
        run: |
          cd week6
          
          echo "============================================"
          echo "Notebook Execution Summary"
          echo "============================================"
          
          if [ -f "week6_executed.ipynb" ]; then
            echo "✓ Executed notebook exists"
            
            if grep -q '"output_type": "error"' week6_executed.ipynb; then
              echo "⚠ Warning: Notebook contains execution errors"
            else
              echo "✓ Notebook executed without errors"
            fi
          else
            echo "✗ Executed notebook not found"
          fi
          echo "============================================"
      
      - name: 📊 Generate execution summary
        if: always()
        run: |
          echo "============================================"
          echo "EXECUTION SUMMARY"
          echo "============================================"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Workflow: ${{ github.workflow }}"
          echo "Run number: ${{ github.run_number }}"
          echo ""
          if [ -d "data" ]; then
            echo "Generated files:"
            ls -lh data/*.h5ad data/*.csv data/*.png 2>/dev/null || echo "  (none found)"
          fi
          echo "============================================"
      
      - name: 📦 Upload executed notebook
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: week6-executed-notebook
          path: week6/week6_executed.ipynb
          retention-days: 30
      
      - name: 📊 Upload analysis results
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: week6-analysis-results
          path: |
            data/*.h5ad
            data/*.csv
            data/*.png
          retention-days: 30
          if-no-files-found: warn
      
      - name: 🗂️ Upload logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: week6-failure-logs
          path: |
            week6/*.ipynb
            data/**/*.log
          retention-days: 7
          if-no-files-found: ignore
      
      - name: ✅ Final status
        if: success()
        run: |
          echo "============================================"
          echo "✅ SUCCESS - Week 6 Assignment Complete"
          echo "============================================"
          echo ""
          echo "All tasks completed successfully:"
          echo "  ✓ Alevin-fry alignment and quantification"
          echo "  ✓ Leiden clustering"
          echo "  ✓ CellTypist automatic annotation"
          echo "  ✓ Visualization and reporting"
          echo ""
          echo "Requirements met for full credit (4/4 points)"
          echo "============================================"
      
      - name: ❌ Failure summary
        if: failure()
        run: |
          echo "============================================"
          echo "❌ FAILURE - Week 6 Assignment Failed"
          echo "============================================"
          echo ""
          echo "Please check uploaded artifacts for details"
          echo "============================================"
