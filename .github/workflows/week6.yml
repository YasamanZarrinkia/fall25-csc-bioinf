name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install system dependencies (no salmon from apt)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            wget tar gzip unzip \
            python3 python3-pip python3-venv \
            build-essential \
            libz-dev libbz2-dev liblzma-dev \
            libtbb-dev libtbb12

      - name: 🧬 Install Salmon binary (v1.10.0)
        run: |
          wget https://github.com/COMBINE-lab/salmon/releases/download/v1.10.0/salmon-1.10.0_linux_x86_64.tar.gz

          # Detect top-level dir inside the tarball (e.g., salmon-latest_linux_x86_64)
          SALMON_DIR=$(tar -tzf salmon-1.10.0_linux_x86_64.tar.gz | head -1 | cut -f1 -d"/")
          echo "Detected Salmon directory: $SALMON_DIR"

          tar -xzf salmon-1.10.0_linux_x86_64.tar.gz

          sudo cp "$SALMON_DIR/bin/salmon" /usr/local/bin/salmon
          sudo chmod +x /usr/local/bin/salmon

          echo "Salmon version:"
          salmon --version

      - name: 🐍 Set up Python environment
        run: |
          python3 -m venv week6-env
          source week6-env/bin/activate

          python3 -m pip install --upgrade pip setuptools wheel

          # 🔒 Pin to a compatible stack so numpy/pandas don't fight
          pip install \
            "numpy==1.26.4" \
            "pandas==2.1.4" \
            "scanpy==1.10.2" \
            anndata scipy matplotlib seaborn jupyter

          # Alevin-fry helper + automatic cell annotation
          pip install pyroe celltypist

          # Try to install alevin-fry CLI via pip (optional, won't fail the build if unavailable)
          pip install "alevin-fry>=0.10.0" --extra-index-url https://test.pypi.org/simple/ || true

          # For non-interactive notebook execution
          pip install nbconvert

      - name: 🧪 Run week6 notebook non-interactively
        run: |
          source week6-env/bin/activate
          jupyter nbconvert --to notebook --execute week6/week6.ipynb --output week6_executed.ipynb

