name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install micromamba
        run: |
          sudo apt-get update -y
          sudo apt-get install -y bzip2 curl

          curl -Ls https://micro.mamba.pm/api/micromamba/linux-64/latest \
            | tar -xvj bin/micromamba

          echo 'export MAMBA_ROOT_PREFIX="$HOME/micromamba"' >> $GITHUB_ENV
          echo "$HOME/micromamba/bin" >> $GITHUB_PATH

      - name: 🧪 Create environment with Salmon + Alevin-fry + Pyroe + Scanpy + CellTypist
        run: |
          eval "$(./bin/micromamba shell hook -s bash)"

          micromamba create -y -n week6 -c bioconda -c conda-forge \
            python=3.10 \
            salmon \
            alevin-fry \
            pyroe \
            scanpy \
            celltypist \
            nbconvert \
            pandoc \
            jupyter

          micromamba activate week6

          echo "=== Versions ==="
          salmon --version
          alevin-fry --version
          python --version

      - name: 🔍 Debug: ensure data is available
        run: |
          echo "=== Data check ==="
          find week6/data -type f | head -20

      - name: 🧪 Run notebook non-interactively
        run: |
          eval "$(./bin/micromamba shell hook -s bash)"
          micromamba activate week6

          echo "=== Running notebook ==="
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --output week6_executed.ipynb

