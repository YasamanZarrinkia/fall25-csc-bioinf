name: "Week6 Bioinformatics Pipeline CI"

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: "Checkout repo"
        uses: actions/checkout@v4

      - name: "Install micromamba + create env"
        uses: mamba-org/setup-micromamba@v1
        with:
          micromamba-version: "1.5.0"
          environment-name: week6
          create-args: >-
            python=3.10
            salmon
            alevin-fry
            pyroe
            scanpy
            celltypist
            nbconvert
            jupyter
            pandas
            numpy
          channels: conda-forge,bioconda
          init-shell: bash

      - name: "Debug: list data files"
        shell: bash
        run: |
          echo "=== Data check ==="
          find week6/data -type f | head -20

      - name: "Execute week6 notebook"
        shell: bash
        run: |
          micromamba activate week6
          echo "=== Running notebook ==="
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --output week6_executed.ipynb

