name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          channels: conda-forge,bioconda,defaults
          auto-activate-base: true

      - name: Install bioinformatics dependencies
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge -c bioconda \
            salmon \
            alevin-fry \
            pyroe \
            scanpy \
            celltypist \
            nbconvert \
            jupyter \
            pandas \
            numpy

      - name: Debug data files
        shell: bash -l {0}
        run: |
          echo "=== Data files in week6/data ==="
          find week6/data -type f | head -20 || true

      - name: Run week6 notebook
        shell: bash -l {0}
        run: |
          echo "Python version:"
          python --version
          echo "Salmon version:"
          salmon --version || true

          echo "=== Running notebook ==="
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --output week6_executed.ipynb

