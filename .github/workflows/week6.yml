name: Week 6 Single-Cell Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # Create a micromamba env with everything needed for week6.ipynb
      - name: Set up micromamba environment
        uses: mamba-org/setup-micromamba@v2
        with:
          micromamba-version: latest
          environment-name: week6-env
          create-args: >-
            python=3.11
            scanpy
            anndata
            celltypist
            pyroe
            jupyter
            matplotlib
            pandas
            numpy
            scipy
            salmon
            alevin-fry
            samtools
          condarc: |
            channels:
              - conda-forge
              - bioconda
              - defaults

      - name: Version checks
        shell: bash -l {0}
        run: |
          echo "Python:"
          python --version
          echo "Pip:"
          pip --version
          echo "Salmon:"
          salmon --version
          echo "Alevin-fry:"
          alevin-fry --version
          echo "Samtools:"
          samtools --version | head -n 1

      - name: Run Week 6 notebook
        shell: bash -l {0}
        run: |
          cd week6
          jupyter nbconvert \
            --to notebook \
            --execute week6.ipynb \
            --output week6_executed.ipynb

      - name: Upload executed notebook
        uses: actions/upload-artifact@v4
        with:
          name: week6-notebook
          path: week6/week6_executed.ipynb

