name: Week6 Single-cell Analysis CI

on:
  push:
    paths:
      - "week6/**"
      - ".github/workflows/week6.yml"
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v2
        with:
          auto-update-conda: true
          python-version: "3.10"
          channels: conda-forge,bioconda,defaults
          auto-activate-base: true

      - name: Install bioinformatics tools
        shell: bash -l {0}
        run: |
          conda install -y -c conda-forge -c bioconda \
            salmon \
            alevin-fry \
            pyroe \
            scanpy \
            celltypist \
            nbconvert \
            jupyter \
            pandas=1.5.3 \
            numpy

      - name: Download CellTypist model
        shell: bash -l {0}
        run: |
          python -c \"import celltypist; celltypist.models.download_models(force_update=True)\" || echo \"Model download may have issues\"

      - name: Run week6 notebook
        shell: bash -l {0}
        run: |
          echo \"=== Running Week 6 Notebook ===\"
          jupyter nbconvert --to notebook --execute week6/week6.ipynb \
            --output week6_executed.ipynb \
            --allow-errors \
            --ExecutePreprocessor.timeout=3600

      - name: Check assignment completion
        shell: bash -l {0}
        run: |
          echo \"=== ASSIGNMENT COMPLETION CHECK ===\"
          
          # Check for key outputs
          if [ -d \"week6/proc/af_quant\" ]; then
            echo \"✅ POINT 1: Alignment/quantification completed\"
          else
            echo \"❌ POINT 1: Quantification missing\"
          fi
          
          if grep -q \"leiden\" week6_executed.ipynb && grep -q \"UMAP\" week6_executed.ipynb; then
            echo \"✅ POINT 2: Clustering completed (Leiden + UMAP)\"
          else
            echo \"❌ POINT 2: Clustering incomplete\"
          fi
          
          if grep -q \"cell_type\" week6_executed.ipynb; then
            echo \"✅ POINTS 3-4: Cell type annotation completed\"
          else
            echo \"❌ POINTS 3-4: Cell type annotation missing\"
          fi

      - name: Upload results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: week6-results
          path: |
            week6_executed.ipynb
            week6/proc/
          retention-days: 30
