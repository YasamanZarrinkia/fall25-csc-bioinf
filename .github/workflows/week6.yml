name: Week6 Bioinformatics Pipeline CI

on:
  push:
    paths:
      - 'week6/**'
      - '.github/workflows/week6.yml'
  workflow_dispatch:

jobs:
  week6:
    runs-on: ubuntu-22.04
    env:
      NUMBA_THREADING_LAYER: workqueue
      NUMBA_NUM_THREADS: 1
      OMP_NUM_THREADS: 1

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🧰 Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y \
            wget tar gzip unzip \
            python3 python3-pip python3-venv \
            build-essential \
            libz-dev libbz2-dev liblzma-dev \
            libtbb-dev libtbb12

      - name: 🐍 Set up Python environment
        run: |
          python3 -m venv week6-env
          source week6-env/bin/activate
          python3 -m pip install --upgrade pip setuptools wheel

          # Pin compatible versions
          pip install \
            "numpy==1.26.4" \
            "pandas==2.1.4" \
            "scanpy==1.10.2" \
            anndata scipy matplotlib seaborn jupyter

          pip install pyroe celltypist
          pip install "alevin-fry>=0.10.0" --extra-index-url https://test.pypi.org/simple/ || true
          pip install nbconvert

      - name: 🧬 Install Salmon binary (v1.10.0) with proper libraries
        run: |
          wget https://github.com/COMBINE-lab/salmon/releases/download/v1.10.0/salmon-1.10.0_linux_x86_64.tar.gz

          # Detect extracted folder
          SALMON_DIR=$(tar -tzf salmon-1.10.0_linux_x86_64.tar.gz | head -1 | cut -f1 -d"/")
          echo "Detected Salmon directory: $SALMON_DIR"

          tar -xzf salmon-1.10.0_linux_x86_64.tar.gz

          # Copy libs safely
          if [ -d "$SALMON_DIR/lib" ]; then
            sudo cp -r "$SALMON_DIR/lib/"* /usr/local/lib/
          fi

          # Copy binary
          sudo cp "$SALMON_DIR/bin/salmon" /usr/local/bin/salmon
          sudo chmod +x /usr/local/bin/salmon

          # Refresh loader cache
          sudo ldconfig

          echo "=== Salmon version ==="
          salmon --version

      - name: 🔍 Debug: Check data structure
        run: |
          echo "=== Checking data structure ==="
          find week6/data -type f | head -20
          echo "=== Done ==="

      - name: 🧪 Run week6 notebook non-interactively
        run: |
          source week6-env/bin/activate
          echo "=== Running notebook ==="
          timeout 20m jupyter nbconvert --to notebook --execute week6/week6.ipynb --output week6_executed.ipynb

